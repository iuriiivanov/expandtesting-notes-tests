version: "3.8"

services:
  tests:
    build: .
    container_name: api-tests
    volumes:
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/allure-report
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "pytest --alluredir=allure-results &&
             allure generate allure-results -o allure-report --clean"

  allure:
    image: frankescobar/allure-docker-service:latest
    container_name: allure-service
    environment:
      - CHECK_RESULTS_EVERY_SECONDS=5
      - KEEP_HISTORY=1
    ports:
      - "5050:5050"
    volumes:
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/default-reports
    depends_on:
      - tests
